<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💖</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 30px;
      color: #e63946;
      font-size: 32px;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
      transition: transform 0.2s ease;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      left: 50%;
      transform: translateX(-50%);
      animation: wobble 1.5s infinite;
    }

    #no {
      background: #adb5bd;
      color: #333;
      left: 50%;
      top: 60px;
      transform: translateX(-50%);
    }

    @keyframes wobble {
      0% { transform: translateX(-50%) rotate(0deg); }
      25% { transform: translateX(-50%) rotate(3deg); }
      50% { transform: translateX(-50%) rotate(0deg); }
      75% { transform: translateX(-50%) rotate(-3deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my Valentine, Jia? 💘</h1>
    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 🙈</button>
    </div>
  </div>

  <script>
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');

  // Start position (inside the card area)
  let noX = noBtn.offsetLeft;
  let noY = noBtn.offsetTop;

  // Smooth velocity
  let vx = 0;
  let vy = 0;

  document.addEventListener('mousemove', (e) => {
    const rect = noBtn.getBoundingClientRect();
    const bx = rect.left + rect.width / 2;
    const by = rect.top + rect.height / 2;

    const dx = bx - e.clientX;
    const dy = by - e.clientY;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;

    // Only react when cursor is close
    if (dist < 150) {
      const force = (150 - dist) / 150;
      vx += (dx / dist) * force * 6;
      vy += (dy / dist) * force * 6;
    }

    // Friction for smooth movement
    vx *= 0.85;
    vy *= 0.85;

    noX += vx;
    noY += vy;

    // Keep the button INSIDE the card
    const container = document.querySelector('.buttons');
    const maxX = container.clientWidth - noBtn.offsetWidth;
    const maxY = container.clientHeight - noBtn.offsetHeight;

    noX = Math.max(0, Math.min(maxX, noX));
    noY = Math.max(0, Math.min(maxY, noY));

    noBtn.style.left = noX + 'px';
    noBtn.style.top = noY + 'px';
  });

  yesBtn.addEventListener('click', () => {
    document.body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);font-family:Arial;">
        <h1 style="font-size:42px;color:#e63946;">Yay Jia!!! 💕🥰</h1>
      </div>`;
  });
</script>
</body>
</html>
