<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine 💖</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 30px;
      color: #e63946;
      font-size: 32px;
    }

    .buttons {
      position: relative;
      width: 260px;
      height: 140px;
      margin: auto;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
      user-select: none;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      left: 50%;
      transform: translateX(-50%);
      animation: wobble 1.5s infinite;
    }

    #no {
      background: #adb5bd;
      color: #333;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
    }

    @keyframes wobble {
      0% { transform: translateX(-50%) rotate(0deg); }
      25% { transform: translateX(-50%) rotate(3deg); }
      50% { transform: translateX(-50%) rotate(0deg); }
      75% { transform: translateX(-50%) rotate(-3deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Will you be my Valentine, Jia? 💘</h1>
    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 🙈</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const container = document.querySelector('.buttons');

    let x = (container.clientWidth - noBtn.offsetWidth) / 2;
    let y = 70;
    let vx = 0;
    let vy = 0;
    let panic = 0;

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    document.addEventListener('mousemove', (e) => {
      const rect = noBtn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const dx = cx - e.clientX;
      const dy = cy - e.clientY;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;

      if (dist < 120) {
        panic = clamp(panic + 0.02, 0, 1);
        const force = (120 - dist) / 120;
        const speed = 1 + panic * 2;
        vx += (dx / dist) * force * speed;
        vy += (dy / dist) * force * speed;
      } else {
        panic *= 0.95;
      }

      vx *= 0.9;
      vy *= 0.9;

      x += vx;
      y += vy;

      const maxX = container.clientWidth - noBtn.offsetWidth;
      const maxY = container.clientHeight - noBtn.offsetHeight;

      x = clamp(x, 0, maxX);
      y = clamp(y, 0, maxY);

      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';

      if (panic > 0.95) {
        noBtn.textContent = 'Okay fine 😳';
        noBtn.style.background = '#ffb3c1';
      }
    });

    document.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      document.dispatchEvent(new MouseEvent('mousemove', {
        clientX: t.clientX,
        clientY: t.clientY
      }));
    }, { passive: true });

    yesBtn.addEventListener('click', () => {
      document.body.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;
        background:linear-gradient(135deg,#ff9a9e,#fad0c4);font-family:Arial;">
          <h1 style="font-size:42px;color:#e63946;">Yay Jia!!! 💕🥰</h1>
        </div>`;
    });
  </script>
</body>
</html>
